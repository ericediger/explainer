<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flight Deck — demo stage</title>
  <!--
    Recording stage for the Flight Deck explainer (public build). A Chrome-style window with a fictional inbox
    on the left and the extension's REAL side panel (app/sidepanel.html/css/js, a snapshot of the app
    folder) on the right. mocks.js stubs chrome.* and answers the Anthropic, SerpApi and OpenAI calls
    with fictional trips. The hash picks the scene: #ask #take #voice #clarify #explore #book.
    The whole stage is laid out at 1600x900 and drawn at 1.5x (zoom) into a 2400x1350 viewport so the
    footage stays sharp when the render zooms in.
  -->
  <link rel="stylesheet" href="app/sidepanel.css" />
  <link rel="stylesheet" href="stage.css" />
  <script src="mocks.js"></script>
</head>
<body>
  <div id="stage">
    <div class="cx-tabs">
      <div class="cx-lights"><i></i><i></i><i></i></div>
      <div class="cx-tab active" id="tabMail">
        <span class="cx-fav cx-fav-mail"></span><span class="cx-tab-title">Inbox — Mail</span><span class="cx-x">&times;</span>
      </div>
      <div class="cx-tab cx-hidden" id="tabBook">
        <span class="cx-fav cx-fav-book"></span><span class="cx-tab-title">Google Flights</span><span class="cx-x">&times;</span>
      </div>
      <div class="cx-newtab">+</div>
    </div>

    <div class="cx-toolbar">
      <span class="cx-nav">&#8592;</span><span class="cx-nav">&#8594;</span><span class="cx-nav">&#8635;</span>
      <div class="cx-omni"><span class="cx-tune"></span><span id="omniText">mail.example.com/inbox</span></div>
      <div class="cx-ext">
        <button id="extBtn" class="cx-ext-btn" title="Flight Deck"><img src="app/icons/icon48.png" alt="" /></button>
        <span class="cx-puzzle" title="Extensions"></span>
        <span class="cx-avatar">JL</span>
      </div>
    </div>

    <div class="cx-body">
      <main class="cx-page" id="mailPage">
        <div class="ml-top">
          <div class="ml-brand"><span class="ml-logo"></span>Mail</div>
          <div class="ml-search">Search mail</div>
        </div>
        <div class="ml-main">
          <ul class="ml-list" id="mailList"></ul>
          <article class="ml-read" id="mailRead"></article>
        </div>
      </main>
      <div class="cx-page cx-loading cx-hidden" id="bookPage">
        <div class="ld-spin"></div>
        <div class="ld-url" id="ldUrl"></div>
        <div class="ld-sub">Loading&hellip;</div>
      </div>

      <aside class="cx-side" id="side">
        <div class="cx-side-head">
          <img src="app/icons/icon16.png" alt="" /><span>Flight Deck</span>
          <span class="cx-side-actions"><i class="cx-pin"></i><i class="cx-close">&times;</i></span>
        </div>
        <div id="panel"></div>
      </aside>
    </div>
  </div>
  <script src="stage.js"></script>
</body>
</html>
